<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Student Feedback System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="index-page">
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
            <div class="flash {{ category }}">
                {{ message }}
            </div>
            {% endfor %}
        {% endif %}
    {% endwith %}
    <div class="glass-container">
        <h1 class="main-title">Online Student Feedback</h1>
        <p class="subtitle">Select Your Portal</p>
        <div class="button-group">
            <a href="/student/login" class="glass-button">
                <span class="icon">👨‍🎓</span>
                <span class="button-text">Student Login</span>
            </a>
            <a href="/faculty/login" class="glass-button">
                <span class="icon">👨‍🏫</span>
                <span class="button-text">Faculty Login</span>
            </a>
            <a href="/admin/login" class="glass-button">
                <span class="icon">⚙️</span>
                <span class="button-text">Admin Login</span>
            </a>
        </div>
    </div>
</body>
</html>
